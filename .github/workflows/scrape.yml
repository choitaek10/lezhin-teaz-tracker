name: Capture Lezhin Teaz counters

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force a fresh capture even if today's morning capture succeeded"
        type: boolean
        default: false
  schedule:
    # Korea is UTC+9 year-round: 10:00 KST = 01:00 UTC on the same day.
    - cron: "0 1 * * *"
    # Catch up at 10:17, 10:37, 11:07 and 12:07 KST if the first run was delayed or failed.
    - cron: "17,37 1 * * *"
    - cron: "7 2,3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  capture:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify capture safeguards
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Capture public counters if due
        id: capture
        continue-on-error: true
        env:
          FORCE_CAPTURE: ${{ inputs.force }}
        run: |
          if [ "$FORCE_CAPTURE" = "true" ]; then
            python scripts/scrape_teaz.py --force
          else
            python scripts/scrape_teaz.py
          fi
      - name: Save changed dashboard data
        run: |
          git add dist/data
          if git diff --cached --quiet -- dist/data; then
            echo "No dashboard data change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: capture Teaz counters $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
      # Deploy even when capture is skipped so a previously failed deploy recovers.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report capture failure
        if: always() && steps.capture.outcome == 'failure'
        run: exit 1
